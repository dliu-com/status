<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Live status of the dliu.com sites: which sites and functions are up, degraded or down.">
  <title>Status · DL status</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://files.dliu.com/dliu.com/ui/v1/dl.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="dl-page">
  <header class="dl-header">
    <a class="dl-brand" href="/"><img class="dl-logo" src="/logo.svg" alt="" width="32" height="32">DL status</a>
    <nav class="dl-nav" aria-label="Site">
      <a class="dl-button" href="/docs">Docs</a>
    </nav>
  </header>
  <main class="dl-main">
    <h1>dliu.com status</h1>
    <section id="overall" class="overall" aria-live="polite">
      <p id="overall-text" class="overall-text">Loading the latest checks…</p>
      <p id="overall-meta" class="dl-muted"></p>
    </section>
    <section id="apps" class="apps" aria-label="Sites"></section>
    <section class="incidents">
      <h2>Recent changes</h2>
      <div class="dl-table-wrap">
        <table class="dl-table">
          <thead><tr><th>When</th><th>Site</th><th>Change</th><th>What</th></tr></thead>
          <tbody id="incidents"><tr><td colspan="4" class="dl-muted">No changes yet.</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="dl-footer">
    <a class="dl-footer-logo" href="https://dliu.com" aria-label="dliu.com"><img src="https://files.dliu.com/dliu.com/favicon.png" alt="" width="24" height="24"></a>
    <a href="https://dliu.com">dliu.com</a> · <a href="/docs">Docs</a>
  </footer>
  <script src="/app.js" defer></script>
</body>
</html>
